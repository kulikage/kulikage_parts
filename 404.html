<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Kulikage Parts</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #3B4046; color: #F3F3EF; font: 16px/1.5 Inter, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font: 600 40px/1.1 "Space Grotesk", Inter, sans-serif; }
  p { margin: 0; color: #C9CED4; }
  a { color: #FDBA74; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>This page isn't here.</h1>
  <p>The link may be old, or the page moved when the site was rebuilt.</p>
  <p><a id="home-link" href="/">Go to the home page</a> · <a href="mailto:sales@kulikage.parts">Email us</a></p>
</main>
<script>
  /* On a project site (user.github.io/repo/) the home page is /repo/, not / */
  (function () {
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home-link').href = '/' + seg + '/';
    }
  })();
</script>
</body>
</html>
